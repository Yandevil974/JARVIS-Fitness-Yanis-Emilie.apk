name: Vérifier la séance JARVIS
on:
  push:
    branches:
      - 'arena/71baa94c-jarvis-fitness-yanis-emilie-ap'
    paths:
      - 'yanis-fitness-evolution/src/pages/Training.jsx'
      - 'yanis-fitness-evolution/src/components/WorkoutLoadControl.jsx'
      - 'yanis-fitness-evolution/tests/workout-video-load.spec.js'
      - 'yanis-fitness-evolution/src/training-jarvis.css'
      - 'yanis-fitness-evolution/src/styles.css'
      - 'yanis-fitness-evolution/src/components/Movement.jsx'
      - 'yanis-fitness-evolution/src/components/LibraryExerciseVisual.jsx'
      - 'yanis-fitness-evolution/tests/library-video-preview.spec.js'
      - 'yanis-fitness-evolution/src/components/RestNext.jsx'
      - 'yanis-fitness-evolution/tests/rest-next-video.spec.js'
      - 'yanis-fitness-evolution/tests/video-warmup.spec.js'
      - 'yanis-fitness-evolution/tests/training-jarvis.spec.js'
      - 'yanis-fitness-evolution/tests/stop-workout-command.spec.js'
      - 'yanis-fitness-evolution/tests/conversation-online.spec.js'
      - 'yanis-fitness-evolution/src/engine/conversation-routing.js'
      - 'yanis-fitness-evolution/src/engine/remote-brain.js'
      - 'yanis-fitness-evolution/src/pages/Jarvis.jsx'
      - 'yanis-fitness-evolution/src/engine/stop-workout-command.js'
      - 'yanis-fitness-evolution/src/store/AppContext.jsx'
      - 'yanis-fitness-evolution/src/engine/startup-voice.js'
      - 'yanis-fitness-evolution/src/pages/Profile.jsx'
      - 'yanis-fitness-evolution/tests/startup-voice.spec.js'
      - '.github/workflows/training-layout-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yanis-fitness-evolution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yanis-fitness-evolution/package-lock.json
      - run: npm ci
      - name: Préparer le navigateur
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Tester la séance, la charge et la vidéo suivante
        run: |
          npm run dev > /tmp/yfe-vite.log 2>&1 &
          trap 'kill $! || true' EXIT
          if ! npx playwright test tests/training-jarvis.spec.js tests/workout-video-load.spec.js tests/rest-next-video.spec.js tests/library-video-preview.spec.js tests/video-warmup.spec.js tests/session-guidance.spec.js tests/stop-workout-command.spec.js tests/conversation-online.spec.js tests/daily-features.spec.js tests/startup-voice.spec.js; then
            node -e '
              const report = require("./tests/e2e-results.json");
              function visit(suite) {
                for (const spec of suite.specs || []) for (const test of spec.tests || []) {
                  for (const result of test.results || []) for (const error of result.errors || []) {
                    const message = (spec.title + ": " + error.message).replace(/\x1b\[[0-9;]*m/g, "").replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
                    console.log("::error::" + message.slice(0, 4000));
                  }
                }
                for (const child of suite.suites || []) visit(child);
              }
              for (const suite of report.suites || []) visit(suite);
            '
            exit 1
          fi
