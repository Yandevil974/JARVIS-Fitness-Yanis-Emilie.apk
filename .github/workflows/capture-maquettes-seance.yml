name: Capturer les deux essais de séance
on:
  push:
    branches:
      - 'arena/71baa94c-jarvis-fitness-yanis-emilie-ap'
    paths:
      - '.github/workflows/capture-maquettes-seance.yml'
      - 'maquettes/essais-seance/index.html'
      - 'maquettes/essais-seance/essais.css'
      - 'maquettes/essais-seance/essais.js'
      - 'maquettes/essais-seance/capture.mjs'
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/71baa94c-jarvis-fitness-yanis-emilie-ap
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yanis-fitness-evolution/package-lock.json
      - run: npm ci
        working-directory: yanis-fitness-evolution
      - name: Capturer les deux vues téléphone
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          python3 maquettes/essais-seance/server.py > /tmp/essais-server.log 2>&1 &
          trap 'kill $! || true' EXIT
          node maquettes/essais-seance/capture.mjs
      - name: Déposer uniquement les deux images sur la branche
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maquettes/essais-seance/essai-1-couleurs.png maquettes/essais-seance/essai-2-style-complet.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add phone screenshots of workout visual trials'
          git push origin HEAD:arena/71baa94c-jarvis-fitness-yanis-emilie-ap
