name: Miroir APK dans le depot (telechargement direct)

# Recopie l'APK publie (release) dans downloads/ du depot, sous le nom utilise
# par la page de telechargement, apres controle de l'empreinte sha256.
#
# Raison d'etre : fournir une copie telechargeable depuis github.com, sans
# dependre des hotes d'assets de release (*.githubusercontent.com) qui peuvent
# etre filtres selon le reseau du telephone.

on:
  push:
    paths:
      - ".github/workflows/mirror-apk.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a copier"
        required: true
        default: "v1.5.1-chrono-gifs-v2"
      nom:
        description: "Nom du fichier dans downloads/"
        required: true
        default: "Yanis-Fitness-Evolution-1.5.1-chrono-gifs-v2.apk"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || 'v1.5.1-chrono-gifs-v2' }}
      NOM: ${{ github.event.inputs.nom || 'Yanis-Fitness-Evolution-1.5.1-chrono-gifs-v2.apk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telecharger l'APK et son empreinte depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          gh release download "$TAG" --pattern '*.apk' --dir _tmp --clobber
          gh release download "$TAG" --pattern '*.sha256' --dir _tmp --clobber
          ls -la _tmp/

      - name: Controler le sha256 avant toute copie
        run: |
          set -euo pipefail
          cd _tmp
          sha256sum -c ./*.sha256

      - name: Installer dans downloads/ sous le nom de telechargement
        run: |
          set -euo pipefail
          mkdir -p downloads
          APK=$(ls _tmp/*.apk | head -1)
          cp "$APK" "downloads/$NOM"
          cd downloads
          sha256sum "$NOM" > "$NOM.sha256"
          sha256sum -c "$NOM.sha256"

      - name: Commit et push du miroir
        run: |
          set -euo pipefail
          rm -rf _tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "Miroir deja a jour, rien a committer."
          else
            git commit -m "Miroir de l'APK publie : $NOM (copie conforme, sha256 verifie)"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Rappel
        run: cat "downloads/$NOM.sha256"
