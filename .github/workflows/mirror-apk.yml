name: Miroir APK dans le depot (telechargement direct)

# Recopie l'APK publie (release) dans downloads/ du depot, sous le nom utilise
# par la page de telechargement, apres controle de l'empreinte sha256.
#
# Raison d'etre : fournir une copie telechargeable depuis github.com/codeload,
# independamment des hotes d'assets de release (*.githubusercontent.com) qui
# peuvent etre filtres selon le reseau du telephone.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a copier"
        required: true
        default: "v1.5.1-evolution-build4"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telecharger l'APK et son empreinte depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || 'v1.5.1-evolution-build4' }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          gh release download "$TAG" --pattern '*.apk' --dir _tmp --clobber
          gh release download "$TAG" --pattern '*.sha256' --dir _tmp --clobber
          ls -la _tmp/

      - name: Controler le sha256 avant toute copie
        run: |
          set -euo pipefail
          cd _tmp
          sha256sum -c ./*.sha256

      - name: Installer dans downloads/ sous le nom de telechargement
        run: |
          set -euo pipefail
          mkdir -p downloads
          APK=$(ls _tmp/*.apk | head -1)
          cp "$APK" downloads/Yanis-Fitness-Evolution-1.5.1.apk
          cd downloads
          sha256sum Yanis-Fitness-Evolution-1.5.1.apk > Yanis-Fitness-Evolution-1.5.1.apk.sha256
          sha256sum -c Yanis-Fitness-Evolution-1.5.1.apk.sha256

      - name: Commit et push du miroir
        run: |
          set -euo pipefail
          rm -rf _tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "Miroir deja a jour, rien a committer."
          else
            git commit -m "Miroir de l'APK publie dans downloads/ (copie conforme, sha256 verifie)"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Rappel
        run: cat downloads/Yanis-Fitness-Evolution-1.5.1.apk.sha256
