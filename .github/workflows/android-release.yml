name: Build Yanis Fitness Evolution APK (release)

# Construit l'APK signé de la version déclarée dans package.json (appId
# app.yanis.fitness.evolution, keystore du dépôt) et l'attache au tag poussé.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag GitHub Release cible"
        required: true
        default: "v1.12.0-biceps-18-20-coached"
      delivery:
        description: "Livraison pour la branche de travail"
        required: false
        type: choice
        default: legacy
        options:
          - legacy
          - dos-01-04
          - dos-01-25
          - epaules-jarvis
          - entrainement-large
          - serie-fusionnee
          - diagnostic-stockage

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yanis-fitness-evolution
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yanis-fitness-evolution/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalle sur ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Browser tests for training layout and video controls
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.delivery == 'entrainement-large' || inputs.delivery == 'serie-fusionnee' || inputs.delivery == 'diagnostic-stockage')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v1.15.0-entrainement-large-') || startsWith(github.ref_name, 'v1.16.0-serie-fusionnee-') || startsWith(github.ref_name, 'v1.17.0-diagnostic-stockage-') || startsWith(github.ref_name, 'v1.18.0-jarvis-conversation-') || startsWith(github.ref_name, 'v1.19.0-videos-quadriceps-'))) }}
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run dev > /tmp/yfe-vite.log 2>&1 &
          trap 'kill $! || true' EXIT
          if ! npx playwright test tests/training-jarvis.spec.js tests/workout-video-load.spec.js tests/rest-next-video.spec.js tests/library-video-preview.spec.js tests/session-guidance.spec.js tests/check-backup.spec.js tests/stop-workout-command.spec.js tests/conversation-online.spec.js tests/full-import.spec.js; then
            node -e '
              const report = require("./tests/e2e-results.json");
              function visit(suite) {
                for (const spec of suite.specs || []) for (const test of spec.tests || []) {
                  for (const result of test.results || []) for (const error of result.errors || []) {
                    const message = (spec.title + ": " + error.message).replace(/\x1b\[[0-9;]*m/g, "").replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
                    console.log("::error::" + message.slice(0, 4000));
                  }
                }
                for (const child of suite.suites || []) visit(child);
              }
              for (const suite of report.suites || []) visit(suite);
            '
            exit 1
          fi

      - name: Install esbuild (runtime portable)
        run: npm install --no-save esbuild

      - name: Build web (vite) + portable runtime + cap sync
        run: |
          npm run build:portable
          npm run build
          npx cap sync android

      # Piège connu (corrigé ici pour le CI) : build:portable écrit media-index.json
      # NON trié, et vite a déjà recopié public/ dans release/ avant le tri.
      # On remet donc les deux index identiques, triés, compact, et le runtime à jour.
      - name: Re-trier media-index + resynchroniser le runtime portable
        run: |
          node -e "
            const fs = require('fs');
            const p = 'public/media-index.json';
            const list = JSON.parse(fs.readFileSync(p, 'utf8'));
            const sorted = list.slice().sort();
            if (sorted.length !== list.length) throw new Error('index corrompu');
            for (const witness of ['d53f6f22d159b4ee', '279bb96defb9a0c8']) {
              if (!sorted.includes('/media/' + witness + '.gif')) throw new Error('media-index absent: ' + witness);
            }
            const compact = JSON.stringify(sorted, null, 0);
            fs.writeFileSync(p, compact);
            fs.writeFileSync('release/media-index.json', compact);
            console.log('media-index trie :', sorted.length, 'entrees');
          "
          cp public/runtime.js release/runtime.js
          cp public/runtime.css release/runtime.css
          git diff --stat -- public/media-index.json release/media-index.json || true

      - name: Assemble signed release APK
        working-directory: yanis-fitness-evolution/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK with release name
        working-directory: yanis-fitness-evolution/android
        run: |
          VERSION=$(node -p "require('../package.json').version || '1.12.0'" 2>/dev/null || echo 1.12.0)
          cp app/build/outputs/apk/release/app-release.apk "yanis-fitness-evolution-${VERSION}.apk"
          sha256sum "yanis-fitness-evolution-${VERSION}.apk" > "yanis-fitness-evolution-${VERSION}.apk.sha256"
          # CONTRÔLE « RIEN NE MANQUE » (règle utilisateur du 16/10) :
          # l'APK livré doit contenir TOUT le travail présent sur la branche.
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          # Version attendue lue dans app/build.gradle (la check suit le bump, plus de version codée en dur).
          EXP_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          EXP_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          printf '%s\n' "$BADGING" | grep -F "package: name='app.yanis.fitness.evolution' versionCode='${EXP_CODE}' versionName='${EXP_NAME}'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          N_DISQUE=$(find ../release/media -maxdepth 1 -type f | wc -l)
          N_APK=$(unzip -l "$APK" | grep -cE "assets/public/media/[^/]+\.(gif|jpg|jpeg|png|webp)$" || true)
          echo "medias sur le disque : $N_DISQUE"
          echo "medias dans l'APK    : $N_APK"
          if [ "$N_DISQUE" != "$N_APK" ]; then
            echo "ECHEC : des medias de l'application sont absents de l'APK."
            exit 1
          fi
          # Contrôle nominatif des animations déjà témoins du lot 1 musculation.
          unzip -l "$APK" | grep -E "acbab53a64c18aab|d36d738b07fe1305|6baa655d39de069e" || exit 1
          # Les GIFs Étirement et les deux GIFs d'échauffement approuvés doivent être dans l'APK.
          for witness in 55d7d6060a20be1b 22f0bfbf80a63b77 1eae9eb2d9e5bfea d53f6f22d159b4ee 279bb96defb9a0c8; do
            unzip -l "$APK" | grep -q "$witness.gif" || { echo "GIF témoin absent de l'APK: $witness.gif"; exit 1; }
          done
          # Les MP4 test7 et leurs posters doivent également être embarqués.
          N_VIDEOS_DISQUE=$(find ../release/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)
          N_VIDEOS_APK=$(unzip -l "$APK" | grep -cE "assets/public/videos/[^/]+\.mp4$" || true)
          echo "videos sur le disque : $N_VIDEOS_DISQUE"
          echo "videos dans l'APK    : $N_VIDEOS_APK"
          if [ "$N_VIDEOS_DISQUE" != "$N_VIDEOS_APK" ]; then
            echo "ECHEC : des videos de l'application sont absentes de l'APK."
            exit 1
          fi
          for witness in warmup-apercu-complet warmup-mise-en-route warmup-mobilite-epaules warmup-mobilite-hanches warmup-activation-scapulaire warmup-pont-fessier; do
            unzip -l "$APK" | grep -q "assets/public/videos/$witness.mp4" || { echo "Video temoin absente de l'APK: $witness.mp4"; exit 1; }
          done
          # Les quatre MP4 biceps #14→#17 et leurs posters de référence sont obligatoires.
          for witness in curl-halteres-incline-supination curl-marteau curl-scott-90-haltere-supination curl-zottman; do
            unzip -l "$APK" | grep -q "assets/public/videos/$witness.mp4" || { echo "Video biceps absente de l'APK: $witness.mp4"; exit 1; }
            unzip -l "$APK" | grep -q "assets/public/videos/posters/$witness.jpg" || { echo "Poster biceps absent de l'APK: $witness.jpg"; exit 1; }
          done
          # Les trois MP4 biceps #18→#20 et leurs posters de référence sont obligatoires.
          for witness in curl-concentration curl-halteres-incline-prise-neutre curl-barre; do
            unzip -l "$APK" | grep -q "assets/public/videos/$witness.mp4" || { echo "Video biceps absente de l'APK: $witness.mp4"; exit 1; }
            unzip -l "$APK" | grep -q "assets/public/videos/posters/$witness.jpg" || { echo "Poster biceps absent de l'APK: $witness.jpg"; exit 1; }
          done
          echo "Controle 'rien ne manque' + GIFs, videos et posters witnesses : OK"

      - name: Verify dos videos and prepare delivery notes
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'dos-01-04') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.12.0-dos-01-04-')) }}
        working-directory: yanis-fitness-evolution/android
        shell: bash
        run: |
          set -euo pipefail
          PHASE=demarrage
          trap 'rc=$?; echo "::error title=Contrôle APK::Échec étape $PHASE (ligne $LINENO, code $rc)"; exit "$rc"' ERR
          APK=app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT=168df81abcbcae290a23cced74bbdc10e226f5093fc6a1c419e950125b74af26
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          PHASE=signature
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/yfe-cert.txt
          if ! grep -Fi "certificate SHA-256 digest: $EXPECTED_CERT" /tmp/yfe-cert.txt; then
            ACTUAL_CERT=$(grep -i 'certificate SHA-256 digest' /tmp/yfe-cert.txt || true)
            echo "::error title=Signature APK::Attendu $EXPECTED_CERT ; reçu $ACTUAL_CERT"
            exit 1
          fi
          PHASE=liste-apk
          unzip -Z1 "$APK" > /tmp/yfe-apk-files.txt
          for id in tirage-vertical-prise-neutre rowing-haltere-un-bras tirage-horizontal-a-la-poulie tirage-vertical-prise-large; do
            PHASE="video-$id"
            grep -Fx "assets/public/videos/$id.mp4" /tmp/yfe-apk-files.txt
            PHASE="poster-$id"
            grep -Fx "assets/public/videos/posters/$id.jpg" /tmp/yfe-apk-files.txt
            PHASE="hash-$id"
            SRC_HASH=$(sha256sum "../public/videos/$id.mp4" | cut -d ' ' -f1)
            APK_HASH=$(unzip -p "$APK" "assets/public/videos/$id.mp4" | sha256sum | cut -d ' ' -f1)
            test "$SRC_HASH" = "$APK_HASH" || { echo "Video differente dans l'APK : $id"; exit 1; }
          done
          PHASE=gif-dos-05
          grep -Fx 'assets/public/media/f00bd9ef43286ee0.gif' /tmp/yfe-apk-files.txt
          if grep -Fxq 'assets/public/videos/rowing-barre-buste-penche.mp4' /tmp/yfe-apk-files.txt; then
            echo 'Le dos #05 doit rester sans nouvelle video.'; exit 1
          fi
          APK_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          cat > /tmp/yfe-delivery-notes.md <<EOF
          ## Yanis Fitness Evolution 1.12.0 — livraison dos #01 à #04

          APK Android signé construit depuis le commit $GITHUB_SHA. Version Android **1.12.0 / 195**, identifiant **app.yanis.fitness.evolution**.

          Les quatre vidéos du dos #01 à #04 sont intégrées en **coached** avec leurs consignes correctives ; les vidéos précédentes et les GIF sont conservés. Dos #05 reste sur son GIF : la photo et la vidéo doivent être refaites.

          ### Vérifications automatiques
          - Signature vérifiée ; empreinte SHA-256 du certificat : $EXPECTED_CERT.
          - SHA-256 de l'APK : $APK_SHA.
          - Les quatre MP4 et posters du dos ont été recherchés dans l'APK ; leurs MP4 sont identiques aux sources de la branche.
          - Présence du GIF dos #05 et absence d'une nouvelle vidéo #05 vérifiées ; décompte des médias et vidéos contrôlé.
          - Les tests de l'application ont été exécutés par le workflow.

          ### Installation
          Sauvegardez vos données dans l'application avant l'installation. Téléchargez l'APK puis ouvrez-le sur Android. Si le système refuse la mise à jour, **ne désinstallez pas** l'application existante : cela pourrait effacer ses données. La version 1.12.0/195 est conservée ; Android et la signature de la version installée déterminent si l'installation par-dessus est acceptée.
          EOF

      - name: Publish dedicated dos delivery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'dos-01-04') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.12.0-dos-01-04-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Yanis Fitness Evolution 1.12.0 — vidéos dos 01 à 04
          prerelease: true
          make_latest: false
          body_path: /tmp/yfe-delivery-notes.md
          files: |
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk.sha256
          fail_on_unmatched_files: true

      - name: Verify all 25 dos videos in signed APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'dos-01-25') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.13.0-dos-01-25-')) }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          EXPECTED_CERT=168df81abcbcae290a23cced74bbdc10e226f5093fc6a1c419e950125b74af26
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/yfe-cert-25.txt
          grep -Fi "certificate SHA-256 digest: $EXPECTED_CERT" /tmp/yfe-cert-25.txt
          node scripts/verify-dos-apk.mjs "$APK"
          APK_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          cat > /tmp/yfe-delivery-25.md <<EOF
          ## Yanis Fitness Evolution 1.13.0 — nouvelles vidéos dos #01 à #25

          APK Android signé construit depuis le commit $GITHUB_SHA, version **1.13.0 / 196**, identifiant **app.yanis.fitness.evolution**.

          Les 25 vidéos dos présentes sur la branche, y compris la dernière vidéo #24, sont intégrées telles que déposées. Les posters, GIF originaux et consignes correctives accompagnant ces vidéos sont conservés. Les autres vidéos et le programme existants restent inclus. Le #11 triceps demeure en attente.

          Les vidéos dos sont accompagnées de consignes correctives : suivre les notices et l'audio plutôt que les imperfections de l'image. Pour #24, l'amplitude derrière la tête n'est pas clairement montrée ; ne pas forcer et rester dans une amplitude confortable.

          ### Vérifications automatiques
          - Tests de l'application exécutés par le workflow.
          - Présence et hash vérifiés pour chacun des 25 MP4, posters et GIF du dos ; associations vidéo contrôlées dans le code de l'APK.
          - Signature vérifiée, empreinte SHA-256 du certificat : $EXPECTED_CERT.
          - SHA-256 de l'APK : $APK_SHA.

          ### Installation
          Sauvegardez vos données dans l'application avant installation. Téléchargez l'APK et ouvrez-le sur Android. La version et la signature sont prévues pour une mise à jour de la version 1.12.0/195, mais Android et la signature de votre application installée déterminent si elle est acceptée. Si Android refuse, **ne désinstallez pas** votre application existante : cela pourrait effacer vos données.
          EOF

      - name: Publish dedicated dos 01–25 delivery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'dos-01-25') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.13.0-dos-01-25-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Yanis Fitness Evolution 1.13.0 — vidéos dos 01 à 25
          prerelease: true
          make_latest: false
          body_path: /tmp/yfe-delivery-25.md
          files: |
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk.sha256
          fail_on_unmatched_files: true

      - name: Verify current videos, GIFs and signature
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'epaules-jarvis') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.14.0-epaules-jarvis-')) }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          EXPECTED_CERT=168df81abcbcae290a23cced74bbdc10e226f5093fc6a1c419e950125b74af26
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/yfe-cert-current.txt
          grep -Fi "certificate SHA-256 digest: $EXPECTED_CERT" /tmp/yfe-cert-current.txt
          node scripts/verify-dos-apk.mjs "$APK"
          node scripts/verify-current-apk.mjs "$APK"
          APK_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          cat > /tmp/yfe-delivery-current.md <<EOF
          ## Yanis Fitness Evolution 1.14.0 — épaules et entraînement JARVIS

          APK Android signé issu du commit $GITHUB_SHA, version **1.14.0 / 197**, identifiant **app.yanis.fitness.evolution**.

          L'application comprend la nouvelle présentation de l'entraînement, la vidéo centrale, la vignette vidéo « Ensuite », la progression et la charge modifiable sous la vidéo, ainsi que les vidéos disponibles sur la branche. Les vidéos d'épaules #18 et #21 partagent le même mouvement et la #23 réutilise la vidéo du développé militaire debout ; leurs consignes spécifiques restent distinctes. Les vidéos #20 et #22 des épaules ne sont pas encore prêtes : leurs GIF d'origine restent disponibles. D'autres exercices et modules attendent encore leurs vidéos. Les vidéos accompagnées de consignes correctives restent en statut coached ; suivez les consignes et ne reproduisez pas les défauts visuels.

          ### Contrôles automatiques
          - Tests de l'application exécutés par le workflow.
          - MP4 et posters de public/videos et GIF de public/media vérifiés individuellement par SHA-256 dans l'APK ; fiches et vidéos des épaules #18, #21 et #23, et références aux GIF #20 et #22 contrôlées dans le bundle principal.
          - Les vidéos, posters et GIF dos sont également contrôlés.
          - Signature vérifiée : certificat SHA-256 $EXPECTED_CERT.
          - SHA-256 de l'APK : $APK_SHA.

          ### Installation
          Sauvegardez vos données avant l'installation. Le numéro de version est supérieur à la 1.13.0/196 et la signature correspond à celle de sa livraison, mais l'acceptation dépend d'Android et de l'application déjà installée. Si Android refuse, **ne désinstallez pas** l'application existante : vous pourriez perdre ses données.
          EOF

      - name: Publish dedicated shoulders and Jarvis delivery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'epaules-jarvis') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.14.0-epaules-jarvis-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Yanis Fitness Evolution 1.14.0 — épaules et entraînement JARVIS
          prerelease: true
          make_latest: false
          body_path: /tmp/yfe-delivery-current.md
          files: |
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk
            yanis-fitness-evolution/android/yanis-fitness-evolution-*.apk.sha256
          fail_on_unmatched_files: true

      - name: Verify 1.15.0 layout, media and signature
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'entrainement-large') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.15.0-entrainement-large-')) }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          EXPECTED_CERT=168df81abcbcae290a23cced74bbdc10e226f5093fc6a1c419e950125b74af26
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/yfe-cert-115.txt
          grep -Fi "certificate SHA-256 digest: $EXPECTED_CERT" /tmp/yfe-cert-115.txt
          node scripts/verify-dos-apk.mjs "$APK"
          node scripts/verify-current-apk.mjs "$APK"
          node scripts/verify-layout-apk.mjs "$APK"
          APK_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          cat > /tmp/yfe-delivery-115.md <<EOF
          ## Yanis Fitness Evolution 1.15.0 — séance plein cadre

          APK Android signé du commit $GITHUB_SHA, version **1.15.0 / 198**, identifiant **app.yanis.fitness.evolution**.

          JARVIS et Adapter sont réunis dans un seul bouton en haut à droite de la séance. Le cadre de l'exercice occupe toute la largeur et les autres cadres sont réorganisés en dessous. La charge modifiable, la vidéo et la vignette « Ensuite » restent disponibles, ainsi que toutes les vidéos déjà présentes. Les GIF d'origine restent conservés. Les épaules #20 et #22 ainsi que d'autres exercices et modules n'ont pas encore de vidéo ; leurs GIF restent disponibles. Les vidéos accompagnées de consignes correctives restent en statut coached.

          ### Vérifications automatiques
          - Tests unitaires et tests navigateur de la séance, de la charge et de la vidéo suivante exécutés par le workflow.
          - JS et CSS actifs contrôlés dans l'APK, avec les éléments de la nouvelle disposition.
          - MP4, posters de public/videos et GIF de public/media vérifiés individuellement par SHA-256 dans l'APK ; les vidéos dos et les épaules #18, #21 et #23 sont également contrôlées.
          - Signature vérifiée : certificat SHA-256 $EXPECTED_CERT.
          - SHA-256 de l'APK : $APK_SHA.

          ### Installation
          Sauvegardez vos données avant installation. La version 1.15.0/198 est supérieure à la 1.14.0/197 et porte la même signature ; Android et l'application installée déterminent si la mise à jour est acceptée. Si Android refuse, **ne désinstallez pas** l'application existante : vous pourriez perdre ses données.
          EOF

      - name: Publish 1.15.0 training delivery
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.delivery == 'entrainement-large') || (github.event_name == 'push' && startsWith(github.ref_name, 'v1.15.0-entrainement-large-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
