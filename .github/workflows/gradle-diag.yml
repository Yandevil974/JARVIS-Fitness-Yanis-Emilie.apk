name: Gradle diagnostic (annotations)

on:
  push:
    tags:
      - "diag-*"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install npm dependencies
        working-directory: yanis-fitness-evolution
        run: npm ci
      - name: Build web + cap sync
        working-directory: yanis-fitness-evolution
        run: |
          npm install --no-save esbuild
          npm run build:portable
          npm run build
          npx cap sync android
      - name: Gradle assembleRelease (log → annotations si échec)
        working-directory: yanis-fitness-evolution/android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > /tmp/gradle-diag.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            {
              echo "## Gradle diag — échec (code $RC)"
              echo ""
              echo "Log : $(wc -l < /tmp/gradle-diag.log) lignes. 100 dernières lignes :"
              echo ""
              echo '```'
              tail -100 /tmp/gradle-diag.log
              echo '```'
            } > /tmp/diag-comment.md
            gh api -X post repos/Yandevil974/JARVIS-Fitness-Yanis-Emilie.apk/comments \
              -f commit_id="$(git rev-parse HEAD)" -F body="$(cat /tmp/diag-comment.md)" > /tmp/diag-comment.json 2>/dev/null || true
            if [ -s /tmp/diag-comment.json ]; then
              echo "Commentaire de diagnostic créé : id=$(python3 -c 'import json;print(json.load(open("/tmp/diag-comment.json"))["id"])' 2>/dev/null || echo '?')"
            fi
            tail -60 /tmp/gradle-diag.log
            exit 1
          fi
          echo "Gradle OK (APK assemblé)."
          ls -la app/build/outputs/apk/release/ || true
