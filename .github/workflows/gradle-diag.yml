name: Gradle diagnostic (annotations)

on:
  push:
    tags:
      - "diag-*"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install npm dependencies
        working-directory: yanis-fitness-evolution
        run: npm ci
      - name: Build web + cap sync
        working-directory: yanis-fitness-evolution
        run: |
          npm install --no-save esbuild
          npm run build:portable
          npm run build
          npx cap sync android
      - name: Gradle assembleRelease (log → annotations si échec)
        working-directory: yanis-fitness-evolution/android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain > /tmp/gradle-diag.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            {
              echo "## Gradle diag — échec (code $RC)"
              echo ""
              echo "Log : $(wc -l < /tmp/gradle-diag.log) lignes. 100 dernières lignes :"
              echo ""
              echo '```'
              tail -100 /tmp/gradle-diag.log
              echo '```'
              echo ""
              echo "### hs_err (crash JVM) :"
              echo '```'
              cat hs_err_pid*.log 2>/dev/null | head -40 || echo "aucun"
              echo '```'
              echo ""
              echo "### dmesg (OOM killer) :"
              echo '```'
              (dmesg 2>/dev/null | tail -15) || echo "dmesg non lisible"
              echo '```'
            } > /tmp/diag-comment.md
            gh api -X post repos/Yandevil974/JARVIS-Fitness-Yanis-Emilie.apk/comments \
              -f commit_id="$(git rev-parse HEAD)" -F body="$(cat /tmp/diag-comment.md)" > /tmp/diag-comment.json 2>/tmp/diag-gh-err.txt || true
            if [ ! -s /tmp/diag-comment.json ]; then
              echo "::warning title=gh api post échoué::$(head -3 /tmp/diag-gh-err.txt)"
            fi
            # Log complet en base64 dans 2 grosses annotations (lisibles via l'API check-runs).
            B64=$(base64 -w0 /tmp/gradle-diag.log 2>/dev/null)
            echo "::error title=GRADLE-LOG-PART1-of-2::${B64:0:30000}"
            echo "::error title=GRADLE-LOG-PART2-of-2::${B64:30000}"
            tail -60 /tmp/gradle-diag.log
            exit 1
          fi
          echo "Gradle OK (APK assemblé)."
          ls -la app/build/outputs/apk/release/ || true
