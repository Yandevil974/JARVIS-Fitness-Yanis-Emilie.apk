name: Gradle diagnostic (annotations)

on:
  push:
    tags:
      - "diag-*"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install npm dependencies
        working-directory: yanis-fitness-evolution
        run: npm ci
      - name: Build web + cap sync
        working-directory: yanis-fitness-evolution
        run: |
          npm install --no-save esbuild
          npm run build:portable
          npm run build
          npx cap sync android
      - name: Gradle assembleRelease (log → annotations si échec)
        working-directory: yanis-fitness-evolution/android
        run: |
          set +e
          trap 'echo "TRAP: signal=$? line=$LINENO time=$(date +%s) pid=$$" >> /tmp/diag-trap.txt' EXIT INT TERM HUP
          { echo "=== MEM AVANT ==="; free -h; nproc; ulimit -v; echo "=== CGROUP ==="; cat /sys/fs/cgroup/memory.max 2>/dev/null; cat /sys/fs/cgroup/memory.current 2>/dev/null; cat /sys/fs/cgroup/memory.events 2>/dev/null; } > /tmp/gradle-diag.log
          timeout 900 ./gradlew assembleRelease --no-daemon --stacktrace --console=plain --max-workers=1 >> /tmp/gradle-diag.log 2>&1
          RC=$?
          echo "=== GRADLE RC=$RC ===" >> /tmp/gradle-diag.log
          echo "=== MEM APRES ===" >> /tmp/gradle-diag.log
          free -h >> /tmp/gradle-diag.log 2>&1
          echo "=== CGROUP APRES ===" >> /tmp/gradle-diag.log
          cat /sys/fs/cgroup/memory.current 2>&1 >> /tmp/gradle-diag.log
          cat /sys/fs/cgroup/memory.peak 2>&1 >> /tmp/gradle-diag.log
          cat /sys/fs/cgroup/memory.events 2>&1 >> /tmp/gradle-diag.log
          echo "=== DMESG ===" >> /tmp/gradle-diag.log
          dmesg 2>&1 | tail -25 >> /tmp/gradle-diag.log
          echo "=== TOP MEM ===" >> /tmp/gradle-diag.log
          ps aux --sort=-%mem 2>/dev/null | head -8 >> /tmp/gradle-diag.log
          echo "=== HS_ERR ===" >> /tmp/gradle-diag.log
          ls -la hs_err_pid*.log 2>&1 >> /tmp/gradle-diag.log
          cat hs_err_pid*.log 2>/dev/null | head -30 >> /tmp/gradle-diag.log
          echo "POSTMORTEM-DONE $(date +%s)" >> /tmp/diag-trap.txt
          if [ $RC -ne 0 ]; then
            {
              echo "## Gradle diag — échec (code $RC)"
              echo ""
              echo "Log : $(wc -l < /tmp/gradle-diag.log) lignes. 100 dernières lignes :"
              echo ""
              echo '```'
              tail -100 /tmp/gradle-diag.log
              echo '```'
              echo ""
              echo "### hs_err (crash JVM) :"
              echo '```'
              cat hs_err_pid*.log 2>/dev/null | head -40 || echo "aucun"
              echo '```'
              echo ""
              echo "### dmesg (OOM killer) :"
              echo '```'
              (dmesg 2>/dev/null | tail -15) || echo "dmesg non lisible"
              echo '```'
            } > /tmp/diag-comment.md
            gh api -X post repos/Yandevil974/JARVIS-Fitness-Yanis-Emilie.apk/comments \
              -f commit_id="$(git rev-parse HEAD)" -F body="$(cat /tmp/diag-comment.md)" > /tmp/diag-comment.json 2>/tmp/diag-gh-err.txt || true
            if [ ! -s /tmp/diag-comment.json ]; then
              echo "::warning title=gh api post échoué::$(head -3 /tmp/diag-gh-err.txt)"
            fi
            # Gros plan sur l'erreur réelle : infos log + tête du dernier bloc de stack, en chunks < 3500 chars (limite annotation = 4096).
            LOGINFO="lignes:$(wc -l < /tmp/gradle-diag.log) octets:$(wc -c < /tmp/gradle-diag.log)"
            LOGINFO="$LOGINFO | derniere tache: $(grep '> Task' /tmp/gradle-diag.log | tail -1)"
            echo "::error title=LOGINFO::${LOGINFO:0:3400}"
            LASTFR=$(grep -n "^	at " /tmp/gradle-diag.log | tail -1 | cut -d: -f1)
            if [ -n "$LASTFR" ]; then
              F=$(head -n "$LASTFR" /tmp/gradle-diag.log | grep -n "^	at " | head -1 | cut -d: -f1)
              S=$((F > 45 ? F - 45 : 1))
              sed -n "${S},$((F + 3))p" /tmp/gradle-diag.log | base64 -w0 > /tmp/diag-stacktop.b64
              echo "::error title=STACKTOP-P1::$(head -c 3400 /tmp/diag-stacktop.b64)"
              echo "::error title=STACKTOP-P2::$(cut -c3401-6800 /tmp/diag-stacktop.b64)"
              echo "::error title=STACKTOP-P3::$(cut -c6801-10200 /tmp/diag-stacktop.b64)"
            fi
            TAIL=$(tail -40 /tmp/gradle-diag.log 2>/dev/null | base64 -w0)
            echo "::error title=TAIL-P1::${TAIL:0:3400}"
            echo "::error title=TAIL-P2::${TAIL:3400:3400}"
            POST=$( { echo "limit:$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null)"; echo "maxusage:$(cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null)"; echo "failcnt:$(cat /sys/fs/cgroup/memory/memory.failcnt 2>/dev/null)"; echo "v2max:$(cat /sys/fs/cgroup/memory.max 2>/dev/null)"; echo "v2peak:$(cat /sys/fs/cgroup/memory.peak 2>/dev/null)"; echo "hserr:"; ls hs_err_pid*.log 2>/dev/null; } | base64 -w0 )
            echo "::error title=CGROUP-POST::${POST:0:3400}"
            tail -60 /tmp/gradle-diag.log
            exit 1
          fi
          echo "Gradle OK (APK assemblé)."
          ls -la app/build/outputs/apk/release/ || true
