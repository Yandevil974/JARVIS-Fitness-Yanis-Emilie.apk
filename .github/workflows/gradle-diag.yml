name: Gradle diagnostic (annotations)

on:
  push:
    tags:
      - "diag-*"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install npm dependencies
        working-directory: yanis-fitness-evolution
        run: npm ci
      - name: Build web + cap sync
        working-directory: yanis-fitness-evolution
        run: |
          npm install --no-save esbuild
          npm run build:portable
          npm run build
          npx cap sync android
      - name: Gradle assembleRelease (log → annotations si échec)
        working-directory: yanis-fitness-evolution/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace > /tmp/gradle-diag.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error title=Gradle a échoué (code $RC)::Dernières lignes d'erreur ci-dessous (annotations)."
            grep -n -E "\.java:[0-9]+: error|error:|FAILED|What went wrong|Caused by|Execution failed|> Task" /tmp/gradle-diag.log | head -60 | while IFS= read -r line; do
              echo "::error file=gradle.log::$line"
            done
            echo "::error file=gradle.log::--- FIN DE GRADLE (30 dernières lignes) ---"
            tail -30 /tmp/gradle-diag.log | while IFS= read -r line; do
              echo "::error file=gradle.log::$line"
            done
            exit 1
          fi
          echo "Gradle OK (APK assemblé)."
          ls -la app/build/outputs/apk/release/ || true
